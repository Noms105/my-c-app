<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Noms</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(145deg, #240046, #6a00f4, #ff4d8d);
      display: flex; align-items: center; justify-content: center;
      padding: 12px; color: #fff;
    }
    .app-shell {
      width: 100%; max-width: 430px; height: 680px;
      background: rgba(25, 0, 48, 0.94); border: 2px solid #ff70a6;
      border-radius: 30px; box-shadow: 0 24px 55px rgba(0, 0, 0, 0.55);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .login-container {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; padding: 28px 24px; text-align: center;
    }
    .logo {
      font-size: 2.5rem; font-weight: 900; letter-spacing: 5px;
      background: linear-gradient(90deg, #ff85a1, #e0aaff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin: 0 0 22px;
    }
    label {
      display: block; text-align: left; font-size: 0.88rem;
      color: #f7cad0; margin-bottom: 6px; font-weight: 600;
    }
    input[type="text"] {
      width: 100%; padding: 14px; border-radius: 14px;
      border: 1.5px solid #c77dff; background: rgba(255, 255, 255, 0.1);
      color: #fff; font-size: 1rem; margin-bottom: 16px; outline: none;
    }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 14px;
      background: linear-gradient(90deg, #ff4d8d, #9d4edd);
      color: #fff; font-size: 1rem; font-weight: 700;
      cursor: pointer; margin-bottom: 10px;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-outline {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid #ff85a1; color: #ffccd5;
    }
    .error { color: #ff758f; font-size: 0.9rem; min-height: 22px; margin-bottom: 10px; }
    .main-layout { display: none; flex: 1; height: 100%; overflow: hidden; }
    .main-layout.active { display: flex; }
    .left-sidebar {
      width: 74px; background: linear-gradient(180deg, #3c096c, #5a189a);
      border-right: 1.5px solid rgba(255, 133, 161, 0.35);
      display: flex; flex-direction: column; align-items: center;
      padding: 18px 8px; gap: 18px;
    }
    .nav-icon-btn {
      width: 56px; height: 58px; border-radius: 16px;
      border: 1.5px solid transparent; background: rgba(255, 255, 255, 0.1);
      color: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer; font-size: 0.7rem; font-weight: 700; gap: 4px;
    }
    .nav-icon-btn span.emoji-ico { font-size: 1.4rem; }
    .nav-icon-btn.active {
      background: linear-gradient(135deg, #ff4d8d, #b5179e);
      border-color: #ffccd5;
    }
    .right-workspace {
      flex: 1; display: flex; flex-direction: column;
      overflow-y: auto; padding: 16px;
    }
    .welcome-box {
      align-self: flex-end; width: 82%;
      background: linear-gradient(135deg, #ff4d8d, #9d4edd);
      border: 2px solid #ffccd5; border-radius: 20px;
      padding: 18px 16px; text-align: center;
      box-shadow: 0 10px 25px rgba(255, 77, 141, 0.4);
      margin-bottom: 18px;
    }
    .welcome-box h2 {
      margin: 0; font-size: 1.55rem; font-weight: 900;
      line-height: 1.2; color: #fff;
    }
    .view-section { display: none; flex: 1; flex-direction: column; }
    .view-section.active { display: flex; }
    .chat-wrapper { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .chat-watermark {
      position: absolute; top: 44%; left: 50%;
      transform: translate(-50%, -50%) rotate(-18deg);
      font-size: 2.7rem; font-weight: 900; text-align: center;
      color: rgba(255, 112, 166, 0.28); pointer-events: none; width: 100%;
    }
    .chat-messages {
      flex: 1; overflow-y: auto; display: flex;
      flex-direction: column; gap: 10px; padding: 6px 2px 12px; z-index: 1;
    }
    .msg-bubble {
      max-width: 82%; padding: 10px 13px; border-radius: 16px;
      background: rgba(157, 78, 221, 0.45); border: 1px solid #ff85a1;
      font-size: 0.92rem; word-wrap: break-word;
    }
    .msg-bubble.me { align-self: flex-end; background: linear-gradient(135deg, #ff4d8d, #9d4edd); }
    .msg-sender { font-size: 0.72rem; font-weight: 800; color: #ffccd5; margin-bottom: 3px; }
    .msg-img { max-width: 100%; border-radius: 10px; margin-top: 6px; display: block; }
    .emoji-strip { display: flex; gap: 8px; overflow-x: auto; padding: 6px 0; z-index: 1; }
    .emoji-chip {
      background: rgba(255, 255, 255, 0.14); border: none;
      border-radius: 10px; padding: 5px 9px; font-size: 1.15rem; cursor: pointer;
    }
    .chat-input-bar { display: flex; gap: 6px; align-items: center; z-index: 1; padding-top: 6px; }
    .chat-input-bar input[type="text"] { margin-bottom: 0; padding: 11px 12px; font-size: 0.92rem; }
    .icon-action {
      background: linear-gradient(135deg, #ff4d8d, #9d4edd);
      border: none; color: #fff; border-radius: 12px;
      padding: 11px 12px; font-weight: 700; cursor: pointer;
    }
    .pet-boxes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .pet-box {
      background: rgba(255, 133, 161, 0.16); border: 1.5px solid #ff85a1;
      border-radius: 14px; padding: 10px 6px; text-align: center;
      font-size: 0.78rem; font-weight: 700;
    }
    .pet-box.selected {
      background: linear-gradient(135deg, #ff4d8d, #9d4edd);
      border-color: #fff; transform: scale(1.04);
    }
    .pet-box .pet-emoji { font-size: 1.8rem; display: block; margin-bottom: 4px; }
    .wheel-area { display: flex; flex-direction: column; align-items: center; margin: 6px 0 12px; }
    .wheel-pointer { font-size: 1.4rem; color: #ffccd5; margin-bottom: -6px; z-index: 2; }
    .wheel-circle {
      width: 185px; height: 185px; border-radius: 50%; border: 5px solid #ffccd5;
      background: conic-gradient(#ff4d8d 0deg 72deg, #9d4edd 72deg 144deg, #ff758f 144deg 216deg, #7b2cbf 216deg 288deg, #c77dff 288deg 360deg);
      display: flex; align-items: center; justify-content: center;
      transition: transform 3.2s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    }
    .wheel-center {
      width: 60px; height: 60px; border-radius: 50%; background: #240046;
      border: 3px solid #ff85a1; display: flex; align-items: center;
      justify-content: center; font-size: 0.75rem; font-weight: 900; color: #ffccd5;
    }
    .cage-card {
      background: rgba(60, 9, 108, 0.65); border: 2px solid #ff85a1;
      border-radius: 22px; padding: 16px; text-align: center;
    }
    .cage-box {
      position: relative; height: 175px; margin: 12px auto; border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 133, 161, 0.2), rgba(36, 0, 70, 0.9));
      border: 4px solid #e0aaff; display: flex; align-items: center;
      justify-content: center; overflow: hidden;
    }
    .cage-bars {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(90deg, transparent, transparent 24px, rgba(255, 204, 213, 0.48) 24px, rgba(255, 204, 213, 0.48) 28px);
      pointer-events: none; z-index: 2;
    }
    .caged-pet-emoji { font-size: 4.5rem; z-index: 1; animation: bouncePet 1.6s infinite ease-in-out; }
    @keyframes bouncePet { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .stat-row { display: flex; justify-content: space-around; margin: 10px 0 14px; font-size: 0.85rem; color: #ffccd5; font-weight: 700; }
    .care-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="screen-ask" class="login-container">
      <h1 class="logo">NOMS</h1>
      <p style="font-size:1.1rem; margin-bottom:20px;">Are you Noms' friend?</p>
      <div id="err-ask" class="error"></div>
      <button id="btn-yes" type="button" class="btn">Yes</button>
      <button id="btn-no" type="button" class="btn btn-outline">No</button>
    </div>

    <div id="screen-login" class="login-container" style="display:none;">
      <h1 class="logo">NOMS</h1>
      <label for="input-user-name">Your Name</label>
      <input id="input-user-name" type="text" autocomplete="off" />
      <label for="input-noms-name">Noms' Full Name</label>
      <input id="input-noms-name" type="text" autocomplete="off" />
      <div id="err-login" class="error"></div>
      <button id="btn-login" type="button" class="btn">Log In</button>
    </div>

    <div id="main-app" class="main-layout">
      <div class="left-sidebar">
        <button id="nav-home" type="button" class="nav-icon-btn active" onclick="switchView('home')">
          <span class="emoji-ico">🏠</span><span>Home</span>
        </button>
        <button id="nav-chat" type="button" class="nav-icon-btn" onclick="switchView('chat')">
          <span class="emoji-ico">💬</span><span>Chat</span>
        </button>
        <button id="nav-pets" type="button" class="nav-icon-btn" onclick="switchView('pets')">
          <span class="emoji-ico">🐾</span><span>Pets</span>
        </button>
        <button type="button" class="nav-icon-btn" style="margin-top:auto;" onclick="logout()">
          <span class="emoji-ico">🚪</span><span>Exit</span>
        </button>
      </div>

      <div class="right-workspace">
        <div id="view-home" class="view-section active">
          <div class="welcome-box"><h2>Welcome to Noms' world</h2></div>
          <p style="color:#f7cad0; text-align:right; font-size:0.92rem; margin-top:4px;">
            Tap <strong>Chat</strong> or <strong>Pets</strong> on the left to explore!
          </p>
        </div>

        <div id="view-chat" class="view-section">
          <div class="chat-wrapper">
